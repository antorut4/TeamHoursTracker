# Configurazione Netlify per Team Hours Tracker
[build]
  publish = "."
  functions = "netlify/functions"

# Moduli condivisi (auth, migrazioni, validazione) importati dalle functions
[functions]
  included_files = ["netlify/lib/**"]

# Node 22 per build e functions (nodemailer 10 richiede Node >= 20)
[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/db"
  to = "/.netlify/functions/db"
  status = 200

[[redirects]]
  from = "/api/daily"
  to = "/.netlify/functions/daily"
  status = 200

[functions."send-daily-reminder-background"]
  schedule = "0 8 * * 1-5"

[functions."send-ticket-reminder-background"]
  schedule = "0 8 * * 1-5"
