<!-- OVERVIEW -->
<div class="panel" id="panel-overview">
  <div class="page-header"><h1>Overview presenze</h1><p>Calendario mensile delle assenze del team</p></div>
  <div class="card">
    <div class="field-row" style="margin-bottom:12px">
      <div class="field" style="max-width:170px"><label>Mese</label><select id="ovMonth"></select></div>
      <div class="field" style="max-width:100px"><label>Anno</label><select id="ovYear"></select></div>
      <div class="field" style="max-width:190px"><label>Team Lead</label><select id="ovLead" onchange="renderOverview()"><option value="">Tutti</option></select></div>
      <div><button class="btn btn-ghost2" onclick="renderOverview()"><i class="fa-solid fa-rotate"></i> Aggiorna</button></div>
    </div>
    <div class="legend">
      <span><span class="legend-dot" style="background:#A100FF"></span>Ferie</span>
      <span><span class="legend-dot" style="background:var(--ok)"></span>Permesso/ROL</span>
      <span><span class="legend-dot" style="background:var(--danger)"></span>Malattia</span>
      <span><span class="legend-dot" style="background:var(--amber-bg);border:1px solid var(--amber-rim)"></span>Festività</span>
      <span><span class="legend-dot" style="background:var(--stone-3)"></span>Weekend</span>
    </div>
    <div class="ov-wrap"><div id="ovCalendar"></div></div>
  </div>
</div>
