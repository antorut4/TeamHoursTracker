<!-- DASHBOARD -->
<div class="panel" id="panel-dashboard">
  <div class="page-header"><h1>Dashboard risorse</h1><p>Panoramica del team: allocazione sui progetti e stato ore del mese corrente</p></div>
  <div id="dashKpi" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px"></div>
  <div id="dashFilterRow" style="display:none;margin-bottom:16px">
    <div class="field" style="max-width:200px"><label>Team Lead</label><select id="dashboardLead" onchange="renderDashboard()"><option value="">Tutti</option></select></div>
  </div>
  <div class="card">
    <div class="card-title"><i class="fa-solid fa-chart-column"></i> Distribuzione progetti per risorsa</div>
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><canvas id="dashCanvas" style="display:block"></canvas></div>
    <p style="font-size:.73rem;color:var(--ink-3);margin-top:8px;text-align:center">Numero di progetti assegnati per ogni risorsa</p>
  </div>
  <div class="card">
    <div class="card-title"><i class="fa-solid fa-id-card"></i> Schede risorse</div>
    <div id="dashGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px"></div>
  </div>
</div>
