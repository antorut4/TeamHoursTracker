<!-- ANDAMENTO PROGETTO: elenco dei progetti della risorsa → dettaglio con grafici e inserimento manuale -->
<div class="panel" id="panel-andamento">
  <div class="page-header"><h1>Andamento progetto</h1><p>I tuoi progetti: apri il dettaglio per andamento ticket ed Extra Effort</p></div>
  <div class="card" id="andFilters" style="display:none">
    <div class="field-row" style="margin-bottom:0">
      <div class="field" style="min-width:220px;max-width:300px"><label>Progetto / area</label><select id="andNav" onchange="andNavChange(this.value)"></select></div>
      <div class="field" style="max-width:170px"><label>Mese</label><select id="andMonth" onchange="renderAndamento().catch(console.error)"></select></div>
      <div class="field" style="max-width:100px"><label>Anno</label><select id="andYear" onchange="renderAndamento().catch(console.error)"></select></div>
      <div class="field" id="andMesiField" style="max-width:140px"><label>Periodo grafico</label>
        <select id="andMesi" onchange="renderAndamento().catch(console.error)"><option value="6">6 mesi</option><option value="12" selected>12 mesi</option></select>
      </div>
      <div><button class="btn btn-ghost2" onclick="renderAndamento().catch(console.error)"><i class="fa-solid fa-rotate"></i> Aggiorna</button></div>
    </div>
  </div>
  <div id="andamentoContent"></div>
  <div id="andEntry"></div>
</div>
