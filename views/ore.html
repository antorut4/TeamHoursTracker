<!-- ORE -->
<div class="panel" id="panel-ore">
  <div class="page-header"><h1>Forecast ore</h1><p>Inserisci le ore previste per ciascuna quindicina</p></div>
  <div class="card">
    <div class="card-title"><i class="fa-regular fa-calendar-plus"></i> Inserimento mensile</div>
    <div class="field-row">
      <div class="field" style="max-width:170px"><label>Mese</label><select id="oreMonth"></select></div>
      <div class="field" style="max-width:100px"><label>Anno</label><select id="oreYear"></select></div>
      <div><button class="btn btn-ghost2" onclick="loadOreForm()"><i class="fa-solid fa-rotate"></i> Carica</button></div>
    </div>
    <div id="oreInfoBox" class="info-box"></div>
    <div class="q-row" style="margin-bottom:14px">
      <div class="q-box">
        <div class="q-box-head"><span>I</span> Quindicina (1–15)</div>
        <div class="field" style="margin-bottom:6px"><label>Ore lavorate</label><input type="number" id="ore1" min="0" max="300" step="0.5" oninput="checkOreStrao()"/></div>
        <div id="oreWarn1" style="display:none;font-size:.76rem;color:var(--warn);background:var(--warn-bg);border-radius:var(--r);padding:5px 10px;margin-bottom:8px"><i class="fa-solid fa-bolt" style="margin-right:5px"></i><span id="oreWarn1Txt"></span></div>
        <div class="field"><label>Note</label><input type="text" id="note1" placeholder="Facoltativo"/></div>
      </div>
      <div class="q-box">
        <div class="q-box-head"><span>II</span> Quindicina (16–fine)</div>
        <div class="field" style="margin-bottom:6px"><label>Ore lavorate</label><input type="number" id="ore2" min="0" max="300" step="0.5" oninput="checkOreStrao()"/></div>
        <div id="oreWarn2" style="display:none;font-size:.76rem;color:var(--warn);background:var(--warn-bg);border-radius:var(--r);padding:5px 10px;margin-bottom:8px"><i class="fa-solid fa-bolt" style="margin-right:5px"></i><span id="oreWarn2Txt"></span></div>
        <div class="field"><label>Note</label><input type="text" id="note2" placeholder="Facoltativo"/></div>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-ink" onclick="saveOre()"><i class="fa-solid fa-floppy-disk"></i> Salva ore</button>
      <div id="oreMsg" class="msg"></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title"><i class="fa-solid fa-list-check"></i> Storico inserimenti</div>
    <div id="myOreList"><p style="color:var(--ink-3);font-size:.83rem">Nessuna ora inserita.</p></div>
  </div>
</div>
