<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registra ore — Team Hours Tracker</title>
<style>
:root{
  --accent:#A100FF;--accent2:#7b00cc;--accent-bg:#f3e8ff;
  --bg:#f4f6f9;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
     min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,.1);
      width:100%;max-width:400px;overflow:hidden}
.card-hd{background:var(--accent);padding:26px 28px;text-align:center}
.card-hd h1{color:#fff;font-size:17px;font-weight:700}
.card-hd small{color:rgba(255,255,255,.75);font-size:12px;display:block;margin-top:3px}
.card-bd{padding:28px}
.u-name{font-size:20px;font-weight:700;color:var(--text);text-align:center;margin-bottom:6px}
.u-date{display:flex;align-items:center;justify-content:center;gap:6px;
        background:var(--accent-bg);color:var(--accent2);padding:7px 16px;
        border-radius:20px;font-size:14px;font-weight:700;width:fit-content;
        margin:0 auto 24px}
label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;
      letter-spacing:.6px;color:var(--muted);margin-bottom:8px}
.ore-wrap{position:relative;margin-bottom:6px}
input[type=number]{width:100%;padding:14px 48px 14px 20px;font-size:30px;font-weight:700;
                   color:var(--text);border:2px solid var(--border);border-radius:10px;
                   text-align:center;outline:none;transition:border-color .2s;
                   -moz-appearance:textfield;background:var(--card)}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]:focus{border-color:var(--accent)}
.ore-unit{position:absolute;right:16px;top:50%;transform:translateY(-50%);
          color:var(--muted);font-size:14px;font-weight:600;pointer-events:none}
.hint{text-align:center;font-size:12px;color:var(--muted);margin-bottom:12px}
.qbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.qbtn{padding:6px 13px;border:1.5px solid var(--border);border-radius:6px;background:var(--card);
      font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
.qbtn:hover{border-color:var(--accent);color:var(--accent)}
.btn-save{width:100%;padding:15px;background:var(--accent);color:#fff;border:none;
          border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;
          transition:background .2s}
.btn-save:hover:not(:disabled){background:var(--accent2)}
.btn-save:disabled{background:#d1d5db;cursor:not-allowed}
.alert{padding:12px 16px;border-radius:8px;font-size:14px;font-weight:500;
       margin-top:14px;display:none;line-height:1.4}
.alert.ok{background:#d1fae5;color:#065f46;display:block}
.alert.err{background:#fee2e2;color:#7f1d1d;display:block}
.loading,.oops{text-align:center;padding:36px 20px}
.spin{width:36px;height:36px;border:3px solid var(--accent-bg);
      border-top-color:var(--accent);border-radius:50%;
      animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.oops .ico{font-size:44px;margin-bottom:14px}
.oops h2{color:var(--text);font-size:17px;margin-bottom:8px}
.oops p{color:var(--muted);font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div class="card-hd">
    <h1>Registrazione Ore</h1>
    <small>Team Hours Tracker</small>
  </div>
  <div class="card-bd" id="app">
    <div class="loading"><div class="spin"></div><p style="color:var(--muted);font-size:14px">Caricamento...</p></div>
  </div>
</div>

<script>
const API = '/api/daily';
let _token = null;

async function callApi(action, payload) {
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, payload })
  });
  const json = await r.json();
  if (!json.ok) throw new Error(json.error || 'Errore sconosciuto');
  return json.data;
}

function fmtDate(iso) {
  const DAYS   = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
  const MONTHS = ['gennaio','febbraio','marzo','aprile','maggio','giugno',
                  'luglio','agosto','settembre','ottobre','novembre','dicembre'];
  const dt = new Date(iso + 'T12:00:00Z');
  return `${DAYS[dt.getUTCDay()]} ${dt.getUTCDate()} ${MONTHS[dt.getUTCMonth()]} ${dt.getUTCFullYear()}`;
}

function renderErr(msg) {
  document.getElementById('app').innerHTML = `
    <div class="oops">
      <div class="ico">🔐</div>
      <h2>Link non valido</h2>
      <p>${msg}</p>
    </div>`;
}

function renderForm(d) {
  const dateLabel = fmtDate(d.data);
  document.getElementById('app').innerHTML = `
    <div class="u-name">${d.fullName}</div>
    <div class="u-date">📅 ${dateLabel}</div>
    ${d.ore !== null ? '<div class="alert ok" id="banner">✓ Ore già registrate — puoi modificarle</div>' : ''}
    <label for="ore-inp">Ore lavorate</label>
    <div class="ore-wrap">
      <input type="number" id="ore-inp"
             value="${d.ore !== null ? d.ore : ''}"
             min="0" max="24" step="0.25" placeholder="0" inputmode="decimal">
      <span class="ore-unit">h</span>
    </div>
    <div class="hint">Es: 8 · 7.5 · 4.25</div>
    <div class="qbtns">
      ${[4,6,7,7.5,8].map(v => `<button class="qbtn" onclick="setH(${v})">${v}h</button>`).join('')}
    </div>
    <button class="btn-save" id="save" onclick="doSave()">Salva</button>
    <div class="alert" id="alert"></div>`;
  document.getElementById('ore-inp').focus();
}

function setH(v) {
  document.getElementById('ore-inp').value = v;
  document.getElementById('ore-inp').focus();
}

async function doSave() {
  const inp  = document.getElementById('ore-inp');
  const btn  = document.getElementById('save');
  const alrt = document.getElementById('alert');
  const bnr  = document.getElementById('banner');
  const ore  = parseFloat(inp.value);
  if (isNaN(ore) || ore < 0 || ore > 24) {
    alrt.className = 'alert err';
    alrt.textContent = '⚠ Inserisci un valore valido (0–24)';
    return;
  }
  btn.disabled = true; btn.textContent = 'Salvataggio...';
  alrt.className = 'alert';
  try {
    await callApi('saveByToken', { token: _token, ore });
    alrt.className = 'alert ok';
    alrt.textContent = `✓ ${ore} ore salvate!`;
    if (bnr) bnr.style.display = 'none';
  } catch (e) {
    alrt.className = 'alert err';
    alrt.textContent = '✗ ' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Salva';
  }
}

(async () => {
  const params = new URLSearchParams(window.location.search);
  _token = params.get('token');
  if (!_token) { renderErr('Nessun token nel link. Usa il link ricevuto via email.'); return; }
  try {
    const data = await callApi('getByToken', { token: _token });
    renderForm(data);
  } catch (e) {
    const scaduto = e.message.includes('scaduto');
    const firma   = e.message.includes('firma') || e.message.includes('malformato');
    renderErr(scaduto ? "Link scaduto. Attendi l'email di domani."
            : firma   ? 'Link non valido. Usa il link ricevuto via email.'
            : 'Errore: ' + e.message);
  }
})();
</script>
</body>
</html>
